<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172941"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MyLife Calendar"><meta name="description" content="ふたりで使うMyLifeカレンダー">
<link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=2.6.0"><title>MyLife Calendar</title>
</head><body>
<div id="app" class="shell calApp">
<div id="calTop" class="calTop"><div class="calHead"><div><small id="yearTitle"></small><h2 id="monthTitle"></h2></div><button id="todayBtn" class="secondary" type="button">今日</button></div><div id="weekdayRow" class="weekdays"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div></div>
<div id="message" class="message hidden" role="status"></div>
<div id="updateBanner" class="updateBanner hidden" role="status"><span>共有の予定が更新されました</span><button type="button" id="updateNow" class="primary small">更新</button></div>
<main><div id="calendarGrid" class="calendarGrid"></div></main>
<nav id="bottomNav" class="bottomNav"><button id="navScope" type="button" class="active">●<span id="navScopeLabel">個人</span></button><button id="navAdd" type="button">＋<span>追加</span></button><button id="navSettings" type="button">⚙<span>設定</span></button></nav>
</div>
<dialog id="eventDialog" class="sheet"><form id="eventForm" class="dialogBody"><div class="dialogHead"><div><span class="eyebrow">MYLIFE EVENT</span><h2 id="eventDialogTitle">予定を追加</h2></div><div class="headActions"><button id="saveEventTop" type="submit" class="primary small">保存</button><button id="closeEvent" type="button" class="iconbutton">✕</button></div></div><input id="eventId" type="hidden"><input id="eventOrigin" type="hidden"><div class="field"><label for="eventTitle">予定のタイトル</label><input id="eventTitle" maxlength="200" required placeholder="例：買い物・お出かけ"></div><div class="field"><label for="eventScope">公開範囲</label><select id="eventScope"><option value="shared">共有（2人に表示）</option><option value="private">非共有（自分のみ）</option></select><div class="hint" id="scopeHelp">共有予定は、2人が追加・編集・削除できます。</div></div><div class="field"><label class="switchRow"><span>終日予定</span><input id="allDay" type="checkbox"></label></div><div class="twoFields"><div class="field"><label for="startDate">開始日</label><input type="date" id="startDate" required></div><div class="field"><label for="startTime">開始時刻</label><input type="time" id="startTime" value="10:00"></div></div><div class="twoFields"><div class="field"><label for="endDate">終了日</label><input type="date" id="endDate" required></div><div class="field"><label for="endTime">終了時刻</label><input type="time" id="endTime" value="11:00"></div></div><div class="field hidden" id="locationField"><label for="eventLocation">場所</label><input id="eventLocation" maxlength="300"></div><div class="field" id="notesField"><label for="eventNotes" id="eventNotesLabel">メモ</label><textarea id="eventNotes" rows="3" maxlength="3000" placeholder="場所や持ち物など"></textarea><div id="noteLinks" class="noteLinks"></div></div><div class="field hidden" id="syncField"><label class="switchRow"><span><strong>Googleカレンダーに同期</strong><small>OFFでもMyLifeとGoogleの既存予定を保持します</small></span><input id="syncGoogle" type="checkbox"></label></div><p id="editHint" class="hint hidden"></p><button type="button" id="resolveSync" class="secondary hidden">Google側の内容を採用して再開</button><div class="dialogActions"><button type="button" class="danger hidden" id="deleteEvent">削除</button><div class="grow"></div><button type="button" class="secondary" id="cancelEvent">キャンセル</button><button id="saveEvent" type="submit" class="primary">保存する</button></div></form></dialog>
<dialog id="dayDialog" class="sheet"><div class="dialogBody"><div class="dialogHead"><div><span class="eyebrow">DAY</span><h2 id="dayDialogTitle">予定</h2></div><button id="closeDay" type="button" class="iconbutton" aria-label="閉じる">✕</button></div><div id="dayDialogEvents" class="eventList"></div><div class="dialogActions"><button type="button" id="dayPrev" class="secondary" aria-label="前の日">‹</button><div class="grow"></div><button type="button" id="dayAdd" class="primary">＋この日に追加</button><div class="grow"></div><button type="button" id="dayNext" class="secondary" aria-label="次の日">›</button></div></div></dialog><dialog id="settingsDialog"><div class="dialogBody settingsBody"><div class="dialogHead"><div><span class="eyebrow">ACCOUNT & CONNECTION</span><h2>接続・設定</h2></div><button id="closeSettings" type="button" class="iconbutton">✕</button></div>
<h3>Googleアカウント</h3><p id="loggedEmail" class="hint">未ログイン</p><button type="button" id="loginBtn" class="primary full">Googleアカウントに接続</button><p id="calendarLink" class="hint"></p><button type="button" id="disconnectGoogle" class="secondary full hidden">カレンダー連携を解除</button><button type="button" id="enableGoogle" class="secondary full hidden">カレンダー連携を再開</button><p id="onboardingStatus" class="hint"></p><p id="lastError" class="hint error" role="status"></p><hr><h3>勤務シフトの同期</h3><button id="settingsSyncAll" type="button" class="primary full syncAll">↻ 勤務シフトを同期</button><p id="lastSync" class="hint">最終同期：未実行</p><p id="syncSummary" class="hint" role="status"></p><p id="syncStatus" class="hint" role="status"></p><hr><h3>明日の勤務と起床</h3><div id="alarmPreview"></div><hr><p class="hint">状態：<span id="connectionPill" class="pill">体験モード</span></p><button id="shareApp" class="secondary full" type="button">共有リンクを送る</button></div></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script><script src="deployment.js?v=2.6.0"></script><script src="core.js?v=2.6.0" defer></script><script src="sync.js?v=2.6.0" defer></script><script src="app.js?v=2.6.0" defer></script>
</body></html>
