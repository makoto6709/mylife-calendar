<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172941"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MyLife Calendar"><meta name="description" content="ふたりで使うMyLifeカレンダー">
<link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>MyLife Calendar</title>
</head><body>
<div id="app" class="shell">
<header class="top"><div class="brand"><div class="brandIcon">✦</div><div><strong>MyLife</strong><small>CALENDAR</small></div></div><div class="right"><button id="shareApp" class="secondary" type="button">共有リンク</button><span id="connectionPill" class="pill">体験モード</span><button class="iconbutton" id="openSettings" type="button" aria-label="設定">⚙</button></div></header>
<div id="syncStatus" class="hint" role="status"></div><div id="message" class="message hidden" role="status"></div>
<main><section class="hero"><div><span class="eyebrow">LIFE, IN SYNC.</span><h1>ふたりの予定を、<br>ひとつの場所に。</h1><p id="greeting">共有も、じぶんだけの予定も。</p></div><button id="quickLogin" type="button" class="primary">Googleで接続</button><button id="addEvent" type="button" class="addMain"><span>＋</span>予定を追加</button></section>
<div class="toolbar"><div class="monthNav"><button id="prevMonth" type="button" aria-label="前月">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" type="button" aria-label="翌月">›</button></div><div class="toolbarBtns"><button id="todayBtn" class="secondary" type="button">今日</button><button id="syncAllBtn" class="primary syncAll" type="button" aria-label="すべて同期">↻ すべて同期</button></div></div>
<div class="filters" id="filters"><button data-filter="all" class="selected">すべて</button><button data-filter="shared">● 共有</button><button data-filter="private">● 個人</button><button data-filter="shift">● 勤務</button><button data-filter="google">● Google</button></div>
<div class="calSurface"><div id="weekdayRow" class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarGrid" class="calendarGrid"></div></div>
<div class="lower"><section class="panel"><div class="sectionHeader"><div><span class="eyebrow">SELECTED DAY</span><h3 id="selectedDayTitle">予定</h3></div><button id="addSelected" type="button" class="linkBtn">＋追加</button></div><div class="toolbarBtns"><button type="button" id="viewDay" class="secondary">日別</button><button type="button" id="viewWeek" class="secondary">週間</button></div><div id="dayEvents" class="eventList"></div></section><section class="panel side"><div class="sectionHeader"><div><span class="eyebrow">TOMORROW</span><h3>勤務と起床</h3></div><span class="tinyIcon">☀</span></div><div id="alarmPreview"></div></section></div></main>
<nav class="bottomNav"><button id="navCalendar" class="active">▦<span>カレンダー</span></button><button id="navToday">☀<span>今日</span></button><button id="navAdd">＋<span>追加</span></button><button id="navSettings">⚙<span>設定</span></button></nav>
</div>
<dialog id="eventDialog"><form id="eventForm" class="dialogBody"><div class="dialogHead"><div><span class="eyebrow">MYLIFE EVENT</span><h2 id="eventDialogTitle">予定を追加</h2></div><button id="closeEvent" type="button" class="iconbutton">✕</button></div><input id="eventId" type="hidden"><input id="eventOrigin" type="hidden"><div class="field"><label for="eventTitle">予定のタイトル</label><input id="eventTitle" maxlength="200" required placeholder="例：買い物・お出かけ"></div><div class="field"><label for="eventScope">公開範囲</label><select id="eventScope"><option value="shared">共有（2人に表示）</option><option value="private">非共有（自分のみ）</option></select><div class="hint" id="scopeHelp">共有予定は、2人が追加・編集・削除できます。</div></div><div class="field"><label class="switchRow"><span>終日予定</span><input id="allDay" type="checkbox"></label></div><div class="twoFields"><div class="field"><label for="startDate">開始日</label><input type="date" id="startDate" required></div><div class="field"><label for="startTime">開始時刻</label><input type="time" id="startTime" value="10:00"></div></div><div class="twoFields"><div class="field"><label for="endDate">終了日</label><input type="date" id="endDate" required></div><div class="field"><label for="endTime">終了時刻</label><input type="time" id="endTime" value="11:00"></div></div><div class="field"><label for="eventLocation">場所</label><input id="eventLocation" maxlength="300"></div><div class="field"><label for="eventNotes">メモ</label><textarea id="eventNotes" rows="3" maxlength="3000" placeholder="場所や持ち物など"></textarea></div><div class="field"><label class="switchRow"><span><strong>Googleカレンダーに同期</strong><small>OFFでもMyLifeとGoogleの既存予定を保持します</small></span><input id="syncGoogle" type="checkbox"></label></div><p id="editHint" class="hint hidden"></p><button type="button" id="resolveSync" class="secondary hidden">Google側の内容を採用して再開</button><div class="dialogActions"><button type="button" class="danger hidden" id="deleteEvent">削除</button><div class="grow"></div><button type="button" class="secondary" id="cancelEvent">キャンセル</button><button id="saveEvent" type="submit" class="primary">保存する</button></div></form></dialog>
<dialog id="settingsDialog"><div class="dialogBody settingsBody"><div class="dialogHead"><div><span class="eyebrow">ACCOUNT & CONNECTION</span><h2>接続・設定</h2></div><button id="closeSettings" type="button" class="iconbutton">✕</button></div>
<h3>Googleカレンダー</h3><p id="loggedEmail" class="hint">未接続</p><button type="button" id="loginBtn" class="primary full">Googleアカウントに接続</button><button type="button" id="disconnectGoogle" class="secondary full hidden">接続解除</button><p id="onboardingStatus" class="hint"></p><hr><h3>カレンダー同期</h3><button id="settingsSyncAll" type="button" class="primary full syncAll">↻ すべて同期</button><p id="lastSync" class="hint">最終同期：未実行</p><p id="syncSummary" class="hint" role="status"></p></div></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script><script src="deployment.js"></script><script src="core.js" defer></script><script src="sync.js" defer></script><script src="app.js" defer></script>
</body></html>
